name: Moneto CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Clean Build & Test Verification (Node 22 LTS)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies across Monorepo Workspaces
        run: npm install

      - name: Build Backend (TypeScript + Prisma Generate)
        run: npm run backend:build

      - name: Build Frontend (Vite + React + Tailwind)
        run: npm run frontend:build

      - name: Run Backend Vitest Test Suite
        run: npm run test

  docker-build-verify:
    name: Docker Multi-Stage Build Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: moneto-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: moneto-frontend:ci
